[package]
name        = "hnsw-nv"
version     = "0.1.0"
description = "Hierarchical Navigable Small World: an approximate nearest-neighbour index as a value.  Build parameters, insert with the level the caller's own randomness chose, k-nearest search with ef, three distance metrics, delete by mark with slot reuse, and a versioned serialised form written into a caller's buffer and read back.  No threads, no file, no clock and no entropy: the randomness arrives as one uniform per insert."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`.  HNSW's construction is randomised: each element joins at a
# level drawn from a geometric distribution, and hnswlib draws it from a
# generator the index owns.  rand-nv is `host`, since its entropy comes
# from the machine, and a `core` package may not depend on a `host` one.
# So the uniform arrives as an argument: `hnswgraph.insert` takes one
# number in (0, 1) and turns it into a level with the index's own
# multiplier.  In exchange a build is reproducible: the same uniforms
# build the same graph on any machine.
#
# No module is declared to build for a device with no heap allocator;
# an index of any useful size is megabytes of heap.
layer       = "core"

category    = "ai"

tags        = ["hnsw", "ann", "nearest-neighbour", "vector-index", "similarity", "search", "embeddings", "sans-io"]
repository  = "https://github.com/novolang/hnsw-nv"
maintainers = ["novo-lang"]
# 0.13.0 is the first toolchain with lists as reference types and `var`
# parameters, which `hnswio.write_into` writes through.
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A vector index you can copy"

[dependencies]
# None.  Not rand-nv, because it is `host` and this is `core`: the
# uniform is a parameter.  Not ndarray-nv: a row here is a `[Float]`,
# since an index holds rows of one dimension it already knows, and
# `ndfloat.to_list` of one row is the seam.  Not embeddings-nv: the three
# distances the two share are a few lines each, and they agree on the
# definitions and the test vectors rather than on a shared symbol.
